<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Tailwind</title>
    <link href="./dist/output.css" rel="stylesheet">
    <link rel="stylesheet" href="node_modules/remixicon/fonts/remixicon.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">


</head>
<body class="font-space w-full h-screen overflow-hidden">

<!-- Contenedor Principal -->
<main class="relative flex flex-row w-screen h-screen overflow-x-auto overflow-y-hidden snap-mandatory snap-x bg-white bg-opacity-20 backdrop-blur-[44px]">
    
    <!-- Sección Única (Sin espaciado superior) -->
    <section class="w-screen h-screen flex justify-center md:justify-center items-center px-6 md:px-12 snap-start">
        <div class="flex flex-col items-start max-w-[900px]">
            <!-- Textos -->
            <h2 class="text-black text-[32px] md:text-[60px] font-light leading-none">UX UI Design <br> Product Design</h2>
            <h1 class="text-black text-[64px] md:text-[120px] font-bold leading-none whitespace-nowrap">Miguel Leo</h1>

            <!-- Botón -->
            <a href="#" class="inline-flex items-center justify-center border border-black text-black h-[56px] md:h-[72px] px-6 text-lg md:text-xl font-medium hover:bg-black hover:text-white transition">
                Conocer más →
            </a>

            <!-- Texto inferior -->
            <p class="text-black text-[14px] md:text-[16px] max-w-xl">
                Impulsando la creación de experiencias de usuario excepcionales mediante estrategias de UX efectivas.
            </p>
        </div>

        <!-- Flecha grande -->
        <div class="hidden md:block ml-auto pr-12">
            <i class="ri-arrow-right-line text-black text-[228px]"></i>
        </div>
    </section>

</main>






    <script src="js/scripts.js" defer></script>


</body>
</html>
