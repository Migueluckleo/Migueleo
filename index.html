<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Tailwind</title>
    <link href="./dist/output.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">

<body class="font-['Space_Grotesk'] bg-gray-100 flex flex-col min-h-screen">

    <!-- Contenedor principal -->

        <button class="bg-white text-black border-2 border-black px-6 py-3 flex items-center gap-2 font-bold mt-6 hover:bg-gray-200 transition">
    Conoce más
    <i class="ri-arrow-right-line text-lg"></i>
</button>
<p class="mt-20 text-[16px] lg:text-[24px] font-medium font-[Space_Grotesk] ">Impulsando la creación de experiencias de usuario excepcionales mediante estrategias de UX efectivas</p>
    </div>
